<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#121918" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Discover, download and publish community-made game mods for Moader."
    />
    <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="/brand/Text.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <link rel="stylesheet" href="/style.css" />
    <title>Moader · Mod catalog</title>
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <header class="top">
      <div class="top-inner">
        <a href="/" class="logo" aria-label="Moader discover"
          ><img src="/brand/lockup.svg" alt="Moader" width="145" height="32"
        /></a>
        <nav class="mainnav" aria-label="Main">
          <a href="/" id="discover-nav">Discover</a
          ><a href="/studio" id="studio-nav">Creator studio</a>
        </nav>
        <div id="account-nav"></div>
      </div>
    </header>
    <main id="main" class="shell" tabindex="-1">
      <p class="loading" role="status">Loading catalog…</p>
    </main>
    <footer class="site-foot">
      <span
        ><img src="/brand/mark.svg" width="23" height="23" alt="" /> Moader
        Catalog</span
      >
      <div>
        <a href="/catalog.json">Console feed</a
        ><a href="https://github.com/H644b/moader-catalog">GitHub</a>
      </div>
    </footer>
    <noscript
      ><p>
        Enable JavaScript to browse and publish mods. The console feed is
        available at <a href="/catalog.json">catalog.json</a>.
      </p></noscript
    >
  </body>
</html>
